# ============================================
# N00bCocoon (新手茧) - 新手保护插件配置
# ============================================

# 消息前缀
prefix: "&a&l[新手茧] &r"

# 保护条件
conditions:
  # 背包物品总价值低于此值时获得保护（使用DeathDrop价值表）
  value-threshold: 5000
  # 注册/首次加入后多少小时内获得保护
  time-threshold-hours: 48

# 保护效果
effects:
  # PvP伤害倍率（0.5 = 50%）
  pvp-damage-multiplier: 0.5
  # PvP单次伤害上限
  pvp-max-damage: 10

# 消退系统：保护到期后的渐进消失
fading:
  # 保护到期后倒计时秒数（期间仍享受完整保护）
  countdown-seconds: 120
  # 倒计时结束后100%抑制敌对生物生成的分钟数
  suppression-minutes: 30
  # 之后生成抑制从100%线性衰减至0%的分钟数
  decay-minutes: 60

# 敌对生物列表（实体类型名，不区分大小写）
# 参考: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
hostile-mobs:
  - ZOMBIE
  - ZOMBIE_VILLAGER
  - ZOMBIFIED_PIGLIN
  - DROWNED
  - SKELETON
  - STRAY
  - WITHER_SKELETON
  - BOGGED
  - CREEPER
  - SPIDER
  - CAVE_SPIDER
  - ENDERMAN
  - WITCH
  - BLAZE
  - GHAST
  - MAGMA_CUBE
  - SLIME
  - PHANTOM
  - GUARDIAN
  - ELDER_GUARDIAN
  - SHULKER
  - PILLAGER
  - VINDICATOR
  - EVOKER
  - RAVAGER
  - VEX
  - WARDEN
  - BREEZE
  - HOGLIN
  - PIGLIN_BRUTE
  - THE_WITHER
  - THE_ENDER_DRAGON

# 消息
messages:
  protected: "&7你受到新手茧保护，暂时安全~"
  protection-expired: "&c新手茧保护已消退，小心行事！"
  status-protected: "&7保护状态: &a✓ 生效中"
  status-expired: "&7保护状态: &c✗ 已过期"
  status-value: "&7背包价值: &e%value% &7点"
  status-time: "&7保护剩余: &e%time%"
  value-info: "&7背包物品总价值: &e%value% &7点"
  admin-reloaded: "&a配置已重载！"
  admin-check: "&7玩家 %player%: 价值 &e%value% &7点, 保护 &e%status%"
